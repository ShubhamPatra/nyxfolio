<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="og-title">
  <title id="og-title">Shubham Patra - Full Stack Developer</title>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main content group - centered -->
  <g transform="translate(600, 280)">
    <!-- Icon - scaled down and positioned left -->
    <g transform="translate(-280, -60)">
      <!-- Left bracket -->
      <path 
        d="M40 0 L0 60 L40 120" 
        stroke="#00ffe0" 
        stroke-width="12" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
      
      <!-- Right bracket -->
      <path 
        d="M100 0 L140 60 L100 120" 
        stroke="#00ffe0" 
        stroke-width="12" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
      
      <!-- Forward slash -->
      <path 
        d="M90 -12 L50 132" 
        stroke="#ffffff" 
        stroke-width="10" 
        fill="none" 
        stroke-linecap="round"/>
    </g>
    
    <!-- Text - positioned right of icon -->
    <g transform="translate(-80, 0)">
      <!-- Name -->
      <text 
        x="0" 
        y="-10" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="56" 
        font-weight="700" 
        fill="#ffffff">
        Shubham Patra
      </text>
      
      <!-- Title -->
      <text 
        x="0" 
        y="50" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="28" 
        font-weight="400" 
        fill="#888888">
        Full Stack Developer
      </text>
    </g>
  </g>
  
  <!-- Domain at bottom -->
  <text 
    x="600" 
    y="560" 
    font-family="JetBrains Mono, monospace" 
    font-size="20" 
    font-weight="500" 
    fill="#00ffe0" 
    text-anchor="middle">
    v1.shubhampatra.dev
  </text>
</svg>
